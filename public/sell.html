<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jualan di Belantara — Buka Toko Gratis</title>
  <meta name="description" content="Mulai berjualan di Belantara. Buka toko gratis, jangkau jutaan pembeli, pembayaran aman.">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230b6b3a'/><path d='M8 24c0-9 5-16 17-18-1 11-7 17-17 18z' fill='%23f6a623'/></svg>">
</head>
<body>
  <div id="app-header"></div>
  <main class="wrap">
    <section class="sell-hero">
      <h1>Punya produk? Saatnya jualan di Belantara.</h1>
      <p>Gabung bareng ribuan seller lain dan jangkau pembeli dari seluruh Indonesia. Buka toko gratis, kelola dari satu dasbor.</p>
      <a class="btn btn-primary btn-lg" href="#daftar" style="margin-top:20px">Buka Toko Sekarang</a>
    </section>

    <section class="section">
      <div class="section-head"><h2>Kenapa jualan di Belantara?</h2></div>
      <div class="perks" id="perks"></div>
    </section>

    <section class="section" id="daftar">
      <div class="panel" style="max-width:560px;margin:0 auto">
        <h2 style="margin-top:0">Daftar Jadi Seller</h2>
        <p class="muted" style="margin-top:-6px">Isi data toko, tim kami bantu proses selanjutnya. (Form demo)</p>
        <form id="seller-form">
          <div class="field">
            <label for="shop">Nama Toko</label>
            <input id="shop" placeholder="mis. Toko Berkah Jaya">
          </div>
          <div class="field">
            <label for="owner">Nama Pemilik</label>
            <input id="owner" placeholder="Nama lengkap">
          </div>
          <div class="field">
            <label for="city2">Kota</label>
            <input id="city2" placeholder="mis. Bandung">
          </div>
          <div class="field">
            <label for="phone2">No. HP / WhatsApp</label>
            <input id="phone2" placeholder="08xxxxxxxxxx">
          </div>
          <button type="submit" class="btn btn-brand btn-block btn-lg">Buka Toko Gratis</button>
        </form>
      </div>
    </section>
  </main>
  <div id="app-footer"></div>
  <script type="module" src="/js/sell.js"></script>
</body>
</html>
